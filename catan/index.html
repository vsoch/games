        // --- ACHIEVEMENTS ---
        function getLongestRoad(pId) {
            let playerEdges = G.edges.filter(e => e.owner === pId);
            if (playerEdges.length === 0) return 0;
            
            let adj = {};
            playerEdges.forEach(e => {
                if (!adj[e.v1]) adj[e.v1] = [];
                if (!adj[e.v2]) adj[e.v2] = [];
                adj[e.v1].push(e); adj[e.v2].push(e);
            });
            
            let maxLen = 0;
            function dfs(currentNode, visitedEdges, currentLen) {
                maxLen = Math.max(maxLen, currentLen);
                let edges = adj[currentNode] || [];
                for (let e of edges) {
                    if (!visitedEdges.has(e.id)) {
                        let vert = G.vertices[currentNode];
                        // Opponent's Town cuts the path!
                        if (vert.owner !== null && vert.owner !== pId) continue;
                        visitedEdges.add(e.id);
                        let nextNode = (e.v1 === currentNode) ? e.v2 : e.v1;
                        dfs(nextNode, visitedEdges, currentLen + 1);
                        visitedEdges.delete(e.id);
                    }
                }
            }
            Object.keys(adj).forEach(v => { dfs(parseInt(v), new Set(), 0); });
            return maxLen;
        }

        function recalculateAchievements() {
            let playerRoads = G.players.map(p => getLongestRoad(p.id));
            let currentHolder = G.longestRoadPlayer;
            let bestLength = Math.max(...playerRoads);
            
            let playersWithBest = [];
            for(let i=0; i<G.players.length; i++) {
                if (playerRoads[i] === bestLength) playersWithBest.push(i);
            }
            
            if (bestLength >= 5) {
                if (currentHolder !== null && playersWithBest.includes(currentHolder)) {
                    // Current holder keeps it on a tie
                } else if (playersWithBest.length === 1) {
                    if (currentHolder !== playersWithBest[0]) {
                        G.longestRoadPlayer = playersWithBest[0];
                        logMessage(`🏆 ${G.players[G.longestRoadPlayer].name} took Longest Road! (${bestLength})`, true);
                    }
                } else {
                    // Tie but current holder isn't one of them, goes back to bank
                    if (currentHolder !== null) {
                        G.longestRoadPlayer = null;
                        logMessage(`⚖️ Longest Road was broken and returned to the bank!`, true);
                    }
                }
            } else {
                if (currentHolder !== null) {
                    G.longestRoadPlayer = null;
                    logMessage(`📉 Longest Road was lost!`, true);
                }
            }
            
            G.players.forEach(p => p.roadLength = playerRoads[p.id]);
            G.players.forEach(p => recalculateVPs(p.id));
        }

        function checkLargestArmy(pId) {
            let knights = G.players[pId].playedKnights;
            if (knights >= 3) {
                if (G.largestArmyPlayer === null) {
                    G.largestArmyPlayer = pId;
                    logMessage(`🛡️ ${G.players[pId].name} claimed Largest Army! (${knights})`, true);
                } else if (G.largestArmyPlayer !== pId && knights > G.players[G.largestArmyPlayer].playedKnights) {
                    G.largestArmyPlayer = pId;
                    logMessage(`🛡️ ${G.players[pId].name} took Largest Army! (${knights})`, true);
                }
            }
            G.players.forEach((p, idx) => recalculateVPs(idx));
        }

        function recalculateVPs(pId) {
            let p = G.players[pId]; let points = 0;
            G.vertices.forEach(v => { if (v.owner === pId) points += (v.building === 'city') ? 2 : 1; });
            
            p.publicVPs = points + (G.longestRoadPlayer === p.id ? 2 : 0) + (G.largestArmyPlayer === p.id ? 2 : 0);
            p.victoryPoints = p.publicVPs + p.devCards.VP + p.newDevCards.VP;
            checkWinCondition(p);
        }

        function checkWinCondition(player) {
            if (player.victoryPoints >= G.vpGoal && G.phase !== 'GAME_OVER') {
                G.phase = 'GAME_OVER';
                showModal("🏆 GAME OVER!", `${player.name} wins with ${player.victoryPoints} Victory Points!`, [{text: "Play Again", value: "ok"}])
                .then(() => location.reload());
            }
        }

        // --- ROLLING & ROBBER ---
        async function handleRoll() {
            if (G.phase !== 'ROLL') return;
            
            document.getElementById('roll-btn').disabled = true;

            let roll1 = Math.floor(Math.random() * 6) + 1; 
            let roll2 = Math.floor(Math.random() * 6) + 1;
            let roll = roll1 + roll2;

            for(let i=0; i<10; i++) {
                drawCSSDie('die1', Math.floor(Math.random() * 6) + 1);
                drawCSSDie('die2', Math.floor(Math.random() * 6) + 1);
                await delay(40);
            }
            G.dice[0] = roll1; G.dice[1] = roll2;
            drawCSSDie('die1', roll1);
            drawCSSDie('die2', roll2);

            logMessage(`🎲 ${G.players[G.activePlayerIdx].name} rolled a ${roll}`);
            G.lastAction = `Rolled a ${roll} 🎲`;

            if (roll === 7) {
                logMessage(`🏜️ Robber awakened! Processing discards...`, true);
                await processDiscards();
                G.postRobberPhase = 'MAIN';
                G.phase = 'ROBBER';
                logMessage(`🥷 ${G.players[G.activePlayerIdx].name} must move the Robber.`);
            } else {
                distributeResources(roll);
                G.phase = 'MAIN';
            }
            updateUI();
        }

        async function processDiscards() {
            for (let p of G.players) {
                let total = Object.values(p.resources).reduce((a,b)=>a+b,0);
                if (total > 7) {
                    let toDrop = Math.floor(total / 2);
                    if (p.isAI) {
                        for(let i=0; i<toDrop; i++) {
                            let avail = Object.keys(p.resources).filter(k => p.resources[k] > 0);
                            let drop = avail[Math.floor(Math.random() * avail.length)];
                            p.resources[drop]--;
                        }
                        logMessage(`${p.name} discarded ${toDrop} resources.`, false, false);
                    } else {
                        await openDiscardModal(toDrop);
                        logMessage(`You discarded ${toDrop} resources.`, false, false);
                    }
                }
            }
        }

        function distributeResources(roll) {
            let gains = {}; G.players.forEach(p => gains[p.id] = {});
            G.hexes.forEach((hex, idx) => {
                if (hex.token === roll && idx !== G.robberHexIndex) {
                    hex.vertexIds.forEach(vId => {
                        let vert = G.vertices[vId];
                        if (vert.owner !== null) {
                            let yieldQty = (vert.building === 'city') ? 2 : 1;
                            G.players[vert.owner].resources[hex.type] += yieldQty;
                            gains[vert.owner][hex.type] = (gains[vert.owner][hex.type] || 0) + yieldQty;
                        }
                    });
                }
            });
            G.players.forEach(p => {
                let pGains = gains[p.id]; let keys = Object.keys(pGains);
                if (keys.length > 0) logMessage(`${p.name} got: ${keys.map(k => `${pGains[k]}x ${RESOURCE_TYPES[k].short}`).join(', ')}`, false, true);
            });
        }

        async function moveRobber(hexId, stealerId) {
            G.robberHexIndex = hexId;
            let hex = G.hexes[hexId]; let victims = new Set();
            hex.vertexIds.forEach(v => {
                let owner = G.vertices[v].owner;
                if (owner !== null && owner !== stealerId) victims.add(owner);
            });
            
            let validVictims = Array.from(victims).filter(v => Object.values(G.players[v].resources).reduce((a,b)=>a+b,0) > 0);
            
            if (validVictims.length > 0) {
                let victimId;
                if (G.players[stealerId].isAI) {
                    victimId = validVictims[0];
                    for (let v of validVictims) {
                        if (G.players[v].publicVPs > G.players[victimId].publicVPs) victimId = v;
                    }
                } else {
                    if (validVictims.length === 1) {
                        victimId = validVictims[0];
                    } else {
                        let buttons = validVictims.map(v => ({text: G.players[v].name, value: v}));
                        let chosen = await showModal("Robber", "Choose a player to steal from:", buttons);
                        victimId = parseInt(chosen);
                    }
                }

                let victim = victimId; let resList = [];
                Object.keys(G.players[victim].resources).forEach(r => {
                    for(let i=0; i<G.players[victim].resources[r]; i++) resList.push(r);
                });
                let stolen = resList[Math.floor(Math.random() * resList.length)];
                G.players[victim].resources[stolen]--;
                G.players[stealerId].resources[stolen]++;
                
                if (G.players[stealerId].isAI) logMessage(`🥷 ${G.players[stealerId].name} stole a card from ${G.players[victim].name}.`, false, true);
                else logMessage(`🥷 You stole 1x ${RESOURCE_TYPES[stolen].short} from ${G.players[victim].name}.`, true, true);
            } else {
                logMessage(`🥷 Robber moved, but no one was robbed.`);
            }
            G.lastAction = 'Moved the Robber 🥷';
            G.phase = G.postRobberPhase || 'MAIN'; updateUI();
        }

        // --- CONSTRAINTS ---
        const COSTS = {
            road: { WOOD: 1, BRICK: 1 }, settlement: { WOOD: 1, BRICK: 1, WHEAT: 1, SHEEP: 1 },
            city: { WHEAT: 2, ORE: 3 }, devCard: { WHEAT: 1, SHEEP: 1, ORE: 1 }
        };

        function canAfford(player, cost) { return Object.keys(cost).every(res => player.resources[res] >= cost[res]); }
        function deductResources(player, cost) { Object.keys(cost).forEach(res => player.resources[res] -= cost[res]); }

        function isValidSettlement(vId, pId, isSetup) {
            let vert = G.vertices[vId];
            if (vert.building !== null) return false;
            let connectedEdges = G.edges.filter(e => e.v1 === vId || e.v2 === vId);
            for (let e of connectedEdges) {
                let neighborId = (e.v1 === vId) ? e.v2 : e.v1;
                if (G.vertices[neighborId].building !== null) return false;
            }
            if (isSetup) return true;
            return connectedEdges.some(e => e.owner === pId);
        }

        function isValidRoad(eId, pId, isSetup) {
            let edge = G.edges[eId];
            if (edge.owner !== null) return false;
            if (isSetup) return (edge.v1 === isSetup.lastVert || edge.v2 === isSetup.lastVert);
            if (G.vertices[edge.v1].owner === pId || G.vertices[edge.v2].owner === pId) return true;
            
            let adjacentEdges = G.edges.filter(e => e.id !== eId && (e.v1 === edge.v1 || e.v2 === edge.v1 || e.v1 === edge.v2 || e.v2 === edge.v2));
            return adjacentEdges.some(e => {
                if (e.owner !== pId) return false;
                let sharedVert = (e.v1 === edge.v1 || e.v2 === edge.v1) ? edge.v1 : edge.v2;
                return (G.vertices[sharedVert].owner === null || G.vertices[sharedVert].owner === pId);
            });
        }

        // --- ACTIONS ---
        function executeBuildSettlement(vId, pId) {
            let isSetup = G.phase === 'SETUP';
            if (!isValidSettlement(vId, pId, isSetup)) return false;
            if (!isSetup) deductResources(G.players[pId], COSTS.settlement);

            G.vertices[vId].building = 'settlement'; G.vertices[vId].owner = pId;
            recalculateAchievements();
            logMessage(`🏠 ${G.players[pId].name} built a Town`);
            G.lastAction = 'Built a Town 🏠';

            if (isSetup && G.setupDirection === 0) {
                G.hexes.forEach(hex => {
                    if (hex.vertexIds.includes(vId) && hex.type !== 'DESERT') G.players[pId].resources[hex.type]++;
                });
            }
            if (isSetup) { G.lastSetupVert = vId; G.buildMode = 'road'; } else G.buildMode = null;
            return true;
        }

        function removeSettlement(vId, pId) {
            let vert = G.vertices[vId];
            if (vert.owner !== pId || vert.building !== 'settlement' || G.phase !== 'SETUP') return false;
            if (G.buildMode !== 'settlement' && G.buildMode !== 'road') return false;
            if (G.buildMode === 'road' && G.lastSetupVert !== vId) return false;
            
            vert.building = null; vert.owner = null; recalculateAchievements();
            if (G.setupDirection === 0) {
                G.hexes.forEach(hex => {
                    if (hex.vertexIds.includes(vId) && hex.type !== 'DESERT') 
                        G.players[pId].resources[hex.type] = Math.max(0, G.players[pId].resources[hex.type] - 1);
                });
            }
            G.buildMode = 'settlement'; hoverRemoveVert = -1;
            logMessage(`Undo: ${G.players[pId].name} removed their setup Town.`);
            return true;
        }

        function executeBuildRoad(eId, pId) {
            let isSetup = G.phase === 'SETUP';
            let validationContext = isSetup ? { lastVert: G.lastSetupVert } : false;
            if (!isValidRoad(eId, pId, validationContext)) return false;

            if (!isSetup) {
                if (G.freeRoads > 0) G.freeRoads--;
                else deductResources(G.players[pId], COSTS.road);
            }

            G.edges[eId].owner = pId;
            logMessage(`🛤️ ${G.players[pId].name} built a Road`);
            G.lastAction = 'Built a Road 🛤️';
            recalculateAchievements();

            if (isSetup) advanceTurnLoop();
            else if (G.freeRoads === 0) G.buildMode = null;
            return true;
        }

        function executeBuildCity(vId, pId) {
            let vert = G.vertices[vId];
            if (vert.owner !== pId || vert.building !== 'settlement') return false;
            deductResources(G.players[pId], COSTS.city);
            vert.building = 'city'; recalculateAchievements();
            logMessage(`🏙️ ${G.players[pId].name} upgraded to a City`);
            G.lastAction = 'Built a City 🏙️';
            G.buildMode = null; return true;
        }

        function buyDevCard(pId = G.activePlayerIdx) {
            let p = G.players[pId];
            if (!canAfford(p, COSTS.devCard) || G.devDeck.length === 0) return;
            deductResources(p, COSTS.devCard);
            
            let card = G.devDeck.pop();
            p.newDevCards[card]++;
            if(card === 'VP') recalculateAchievements();

            if (p.isAI) logMessage(`📜 ${p.name} bought a Dev Card`);
            else logMessage(`📜 You bought a ${DEV_TYPES[card].name}!`);
            G.lastAction = 'Bought Dev Card 📜';
            updateUI();
        }

        async function playDevCard(cardType, pId = G.activePlayerIdx) {
            let p = G.players[pId];
            if (p.devCards[cardType] <= 0 || G.devCardPlayedThisTurn || (G.phase !== 'MAIN' && !(G.phase === 'ROLL' && cardType === 'KNIGHT'))) return;
            
            p.devCards[cardType]--; G.devCardPlayedThisTurn = true;
            logMessage(`🃏 ${p.name} played a ${DEV_TYPES[cardType].name}!`, true);
            G.lastAction = 'Played ' + DEV_TYPES[cardType].name;

            if (cardType === 'KNIGHT') {
                p.playedKnights++; checkLargestArmy(p.id);
                G.postRobberPhase = G.phase;
                G.phase = 'ROBBER';
                if(!p.isAI) logMessage("Select a hex to place the Robber.");
            } 
            else if (cardType === 'ROAD_BUILDING') {
                G.freeRoads = 2;
                if(!p.isAI) G.buildMode = 'road';
            } 
            else if (cardType === 'MONOPOLY') {
                let chosenRes;
                if (p.isAI) {
                    let needs = Object.keys(p.resources).sort((a,b) => p.resources[a] - p.resources[b]);
                    chosenRes = needs[0];
                } else {
                    let selHtml = `<select id="mono-sel">`;
                    Object.keys(RESOURCE_TYPES).filter(r=>r!=='DESERT').forEach(r => selHtml+=`<option value="${r}">${RESOURCE_TYPES[r].short} ${RESOURCE_TYPES[r].name}</option>`);
                    selHtml += `</select>`;
                    chosenRes = await showModal("Play Monopoly", "Choose a resource to steal from all players:<br><br>" + selHtml, [
                        {text:"Steal All", getVal: () => document.getElementById('mono-sel').value}
                    ]);
                }
                let totalStolen = 0;
                G.players.forEach(op => {
                    if(op.id !== p.id && op.resources[chosenRes] > 0) {
                        totalStolen += op.resources[chosenRes];
                        op.resources[chosenRes] = 0;
                    }
                });
                p.resources[chosenRes] += totalStolen;
                logMessage(`👑 ${p.name} monopolized ${totalStolen}x ${RESOURCE_TYPES[chosenRes].short}!`);
            }
            else if (cardType === 'YEAR_OF_PLENTY') {
                let res1, res2;
                if (p.isAI) {
                    let needed = Object.keys(p.resources).sort((a,b) => p.resources[a] - p.resources[b]);
                    res1 = needed[0]; res2 = needed[1] || needed[0];
                } else {
                    let selHtml = `<select id="yop-sel1">`;
                    Object.keys(RESOURCE_TYPES).filter(r=>r!=='DESERT').forEach(r => selHtml+=`<option value="${r}">${RESOURCE_TYPES[r].short} ${RESOURCE_TYPES[r].name}</option>`);
                    selHtml += `</select><br><br><select id="yop-sel2">`;
                    Object.keys(RESOURCE_TYPES).filter(r=>r!=='DESERT').forEach(r => selHtml+=`<option value="${r}">${RESOURCE_TYPES[r].short} ${RESOURCE_TYPES[r].name}</option>`);
                    selHtml += `</select>`;
                    let resultStr = await showModal("Year of Plenty", "Choose 2 free resources:<br><br>" + selHtml, [
                        {text:"Claim", getVal: () => document.getElementById('yop-sel1').value + ',' + document.getElementById('yop-sel2').value}
                    ]);
                    [res1, res2] = resultStr.split(',');
                }
                p.resources[res1]++; p.resources[res2]++;
                logMessage(`🎁 ${p.name} claimed ${RESOURCE_TYPES[res1].short} and ${RESOURCE_TYPES[res2].short}.`);
            }
            
            updateUI();
            
            if (p.isAI && G.phase !== 'MAIN') {
                runAILogic(p);
            }
        }

        // --- TRADING ---
        function updateBankTradeUI() {
            let pId = G.activePlayerIdx;
            if(!G.players[pId] || G.players[pId].isAI) return;
            let giveRes = document.getElementById('trade-give').value;
            let getRes = document.getElementById('trade-get').value;
            let rates = getPlayerTradeRates(pId);
            let cost = rates[giveRes] || 4;
            
            let tradeBtn = document.getElementById('trade-btn');
            tradeBtn.innerText = `Execute (${cost}:1)`;
            
            let p = G.players[pId];
            if (G.phase !== 'MAIN' || giveRes === getRes || p.resources[giveRes] < cost) {
                tradeBtn.disabled = true;
            } else {
                tradeBtn.disabled = false;
            }
        }

        function handleBankTrade() {
            let p = G.players[G.activePlayerIdx];
            let giveRes = document.getElementById('trade-give').value;
            let getRes = document.getElementById('trade-get').value;
            
            let rates = getPlayerTradeRates(p.id);
            let cost = rates[giveRes] || 4;
            
            if (giveRes === getRes || p.resources[giveRes] < cost) return;
            p.resources[giveRes] -= cost; p.resources[getRes] += 1;
            logMessage(`🏦 ${p.name} bank-traded ${cost}x ${RESOURCE_TYPES[giveRes].short} for 1x ${RESOURCE_TYPES[getRes].short}`);
            G.lastAction = 'Port Traded ⚓';
            updateUI();
        }

        async function promptHumanForTrade(ai, offerRes, wantRes) {
            let human = G.players[0];
            let msg = `${ai.name} is offering <strong>1x ${RESOURCE_TYPES[offerRes].short}</strong> in exchange for your <strong>1x ${RESOURCE_TYPES[wantRes].short}</strong>.<br><br>
            <div style="font-size:0.9rem; color:#aaa; margin-bottom: 10px;">
                Your Cards: 🪵 ${human.resources.WOOD} | 🧱 ${human.resources.BRICK} | 🌾 ${human.resources.WHEAT} | 🐑 ${human.resources.SHEEP} | 🪨 ${human.resources.ORE}
            </div>
            Do you accept?`;
            let result = await showModal("Trade Offer", msg, [
                {text: "Accept", value: "YES"}, {text: "Decline", value: "NO", secondary: true}
            ]);
            return result === "YES";
        }

        // --- ARTIFICIAL INTELLIGENCE SYSTEM ---
        async function runAILogic(ai) {
            if (G.players[G.activePlayerIdx].id !== ai.id || G.phase === 'GAME_OVER') return;

            if (G.phase === 'SETUP') {
                if (G.buildMode === 'settlement') {
                    await delay(1000);
                    let bestV = -1, bestScore = -1;
                    G.vertices.forEach((v, id) => {
                        if (isValidSettlement(id, ai.id, true)) {
                            let score = Math.random(); 
                            G.hexes.forEach(h => { if (h.vertexIds.includes(id) && h.token) score += (6 - Math.abs(7 - h.token)); });
                            if (score > bestScore) { bestScore = score; bestV = id; }
                        }
                    });
                    executeBuildSettlement(bestV, ai.id); updateUI(); runAILogic(ai);
                } else if (G.buildMode === 'road') {
                    await delay(1000);
                    let bestE = -1;
                    G.edges.forEach((e, id) => { if (isValidRoad(id, ai.id, { lastVert: G.lastSetupVert })) bestE = id; });
                    executeBuildRoad(bestE, ai.id); updateUI();
                }
            } 
            else if (G.phase === 'ROBBER') {
                await delay(1200);
                let bestHex = -1; let highestEnemyPoints = -1;
                G.hexes.forEach((hex, id) => {
                    if (id !== G.robberHexIndex && hex.type !== 'DESERT') {
                        let enemyValue = 0;
                        hex.vertexIds.forEach(vId => {
                            let owner = G.vertices[vId].owner;
                            if (owner !== null && owner !== ai.id) enemyValue += (G.vertices[vId].building === 'city' ? 2 : 1);
                        });
                        if (enemyValue > highestEnemyPoints) { highestEnemyPoints = enemyValue; bestHex = id; }
                    }
                });
                if(bestHex === -1) bestHex = (G.robberHexIndex + 1) % G.hexes.length;
                await moveRobber(bestHex, ai.id);
                runAILogic(ai); 
            }
            else if (G.phase === 'ROLL') {
                await delay(1500); await handleRoll(); runAILogic(ai);
            } 
            else if (G.phase === 'MAIN') {
                let actionTaken = true;
                
                while (actionTaken && G.phase === 'MAIN') {
                    actionTaken = false;
                    await delay(1500); 

                    if (!G.devCardPlayedThisTurn) {
                        if (ai.devCards.KNIGHT > 0) {
                            let aiRobbed = G.hexes[G.robberHexIndex].vertexIds.some(v => G.vertices[v].owner === ai.id);
                            if (aiRobbed || Math.random() < 0.3) { await playDevCard('KNIGHT', ai.id); return; }
                        }
                        if (!G.devCardPlayedThisTurn && ai.devCards.ROAD_BUILDING > 0 && G.freeRoads === 0 && Object.values(ai.resources).reduce((a,b)=>a+b,0) < 4) {
                            await playDevCard('ROAD_BUILDING', ai.id); actionTaken = true; continue;
                        }
                        if (!G.devCardPlayedThisTurn && ai.devCards.YEAR_OF_PLENTY > 0) {
                            if (canAfford(ai, {WOOD:1}) || canAfford(ai, {WHEAT:1})) { await playDevCard('YEAR_OF_PLENTY', ai.id); actionTaken = true; continue; }
                        }
                        if (!G.devCardPlayedThisTurn && ai.devCards.MONOPOLY > 0) {
                            await playDevCard('MONOPOLY', ai.id); actionTaken = true; continue;
                        }
                    }

                    if (canAfford(ai, COSTS.city)) {
                        let tV = G.vertices.findIndex((v, id) => v.owner === ai.id && v.building === 'settlement');
                        if (tV !== -1) { executeBuildCity(tV, ai.id); actionTaken = true; updateUI(); continue; }
                    }
                    if (!actionTaken && canAfford(ai, COSTS.settlement)) {
                        let tV = G.vertices.findIndex((v, id) => isValidSettlement(id, ai.id, false));
                        if (tV !== -1) { executeBuildSettlement(tV, ai.id); actionTaken = true; updateUI(); continue; }
                    }
                    if (!actionTaken && (canAfford(ai, COSTS.road) || G.freeRoads > 0)) {
                        let tE = G.edges.findIndex((e, id) => isValidRoad(id, ai.id, false));
                        if (tE !== -1) { executeBuildRoad(tE, ai.id); actionTaken = true; updateUI(); continue; }
                    }

                    if (!actionTaken && canAfford(ai, COSTS.devCard) && G.devDeck.length > 0) {
                        buyDevCard(ai.id); actionTaken = true; continue;
                    }

                    if (!actionTaken) {
                        let missing = []; let surplus = [];
                        ['WOOD','BRICK','WHEAT','SHEEP'].forEach(r => {
                            if (ai.resources[r] === 0) missing.push(r);
                            if (ai.resources[r] >= 2) surplus.push(r);
                        });
                        
                        if (missing.length === 1 && surplus.length > 0) {
                            let want = missing[0]; let offer = surplus[0]; let human = G.players[0];
                            if (human.resources[want] > 0) {
                                let accepted = await promptHumanForTrade(ai, offer, want);
                                if (accepted) {
                                    ai.resources[offer]--; ai.resources[want]++;
                                    human.resources[want]--; human.resources[offer]++;
                                    logMessage(`🤝 You accepted trade from ${ai.name}! (${RESOURCE_TYPES[want].short} for ${RESOURCE_TYPES[offer].short})`, true, true);
                                    G.lastAction = 'Completed Trade';
                                    actionTaken = true; updateUI(); continue;
                                }
                            }
                        }

                        let rates = getPlayerTradeRates(ai.id);
                        for (let res of Object.keys(ai.resources)) {
                            let cost = rates[res] || 4;
                            if (ai.resources[res] >= cost) {
                                let missRes = Object.keys(ai.resources).find(r => ai.resources[r] === 0);
                                if (missRes) {
                                    ai.resources[res] -= cost; ai.resources[missRes] += 1;
                                    logMessage(`🏦 ${ai.name} traded ${cost}x ${RESOURCE_TYPES[res].short} for 1x ${RESOURCE_TYPES[missRes].short}`);
                                    G.lastAction = 'Port Traded ⚓';
                                    actionTaken = true; updateUI(); break;
                                }
                            }
                        }
                    }
                }
                if (G.phase === 'MAIN' && G.players[G.activePlayerIdx].id === ai.id) {
                    await delay(1200); 
                    if (G.phase === 'MAIN' && G.players[G.activePlayerIdx].id === ai.id) {
                        handleEndTurn();
                    }
                }
            }
        }

        // --- INTERACTIVE MOUSE INTERFACE ---
        function handleHoverMapping(e) {
            if (G.players[G.activePlayerIdx]?.isAI || G.phase === 'ROLL' || G.phase === 'INIT_ROLL' || G.phase === 'GAME_OVER') { canvas.style.cursor = 'default'; hoverRemoveVert = -1; return; }
            const pos = getMousePos(e);
            
            if (G.phase === 'ROBBER') {
                let closestHex = G.hexes.findIndex(h => Math.hypot(h.x - pos.x, h.y - pos.y) < hexRadius);
                canvas.style.cursor = (closestHex !== -1 && closestHex !== G.robberHexIndex && G.hexes[closestHex].type !== 'DESERT') ? 'crosshair' : 'default';
                return;
            }

            let foundHover = -1;
            let closestIdx = G.vertices.findIndex(v => Math.hypot(v.x - pos.x, v.y - pos.y) < G.interactionRadius);
            
            if (closestIdx !== -1) {
                let v = G.vertices[closestIdx];
                let isRemovableSetupVert = v.owner === G.activePlayerIdx && v.building === 'settlement' && G.phase === 'SETUP' && (G.buildMode === 'settlement' || (G.buildMode === 'road' && v.id === G.lastSetupVert));
                if (isRemovableSetupVert) { 
                    foundHover = closestIdx; canvas.style.cursor = 'pointer'; 
                } 
                else if (G.buildMode) { canvas.style.cursor = 'crosshair'; } 
                else { canvas.style.cursor = 'default'; }
            } else {
                canvas.style.cursor = G.buildMode ? 'crosshair' : 'default';
            }
            if (hoverRemoveVert !== foundHover) { hoverRemoveVert = foundHover; render(); }
        }

        canvas.addEventListener('mousemove', handleHoverMapping);
        canvas.addEventListener('touchmove', function(e) { 
            if(e.cancelable) e.preventDefault(); 
            handleHoverMapping(e); 
        }, {passive: false});

        function handleClickMapping(e) {
            if (!G.players[G.activePlayerIdx] || G.players[G.activePlayerIdx].isAI || G.phase === 'GAME_OVER') return;
            const pos = getMousePos(e);

            if (G.phase === 'ROBBER') {
                let closestHex = G.hexes.findIndex(h => Math.hypot(h.x - pos.x, h.y - pos.y) < hexRadius);
                if (closestHex !== -1 && closestHex !== G.robberHexIndex && G.hexes[closestHex].type !== 'DESERT') {
                    G.phase = 'ROBBER_RESOLVING';
                    moveRobber(closestHex, G.activePlayerIdx);
                }
                return;
            }
            
            if (hoverRemoveVert !== -1) { if (removeSettlement(hoverRemoveVert, G.activePlayerIdx)) updateUI(); return; }

            if (G.buildMode === 'settlement' || G.buildMode === 'city') {
                let closestIdx = G.vertices.findIndex(v => Math.hypot(v.x - pos.x, v.y - pos.y) < G.interactionRadius);
                if (closestIdx !== -1) {
                    if (G.buildMode === 'settlement') { if (executeBuildSettlement(closestIdx, G.activePlayerIdx)) updateUI(); }
                    else { if (executeBuildCity(closestIdx, G.activePlayerIdx)) updateUI(); }
                }
            } 
            else if (G.buildMode === 'road') {
                let closestIdx = G.edges.findIndex(edge => {
                    let v1 = G.vertices[edge.v1], v2 = G.vertices[edge.v2];
                    return Math.hypot((v1.x + v2.x)/2 - pos.x, (v1.y + v2.y)/2 - pos.y) < G.interactionRadius;
                });
                if (closestIdx !== -1) { if (executeBuildRoad(closestIdx, G.activePlayerIdx)) updateUI(); }
            }
        }

        canvas.addEventListener('click', handleClickMapping);
        canvas.addEventListener('touchstart', function(e) {
            if(e.cancelable) e.preventDefault();
            handleHoverMapping(e); 
            handleClickMapping(e);
        }, {passive: false});

        // --- RENDER PLATFORM ---
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#102a43'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            G.hexes.forEach((hex, id) => {
                ctx.save(); ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    let angle = (Math.PI / 3) * i - (Math.PI / 6);
                    let vx = hex.x + hexRadius * Math.cos(angle), vy = hex.y + hexRadius * Math.sin(angle);
                    if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
                }
                ctx.closePath();
                ctx.fillStyle = RESOURCE_TYPES[hex.type].color; ctx.fill();
                ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
                ctx.restore();

                if (hex.token && id !== G.robberHexIndex) {
                    ctx.beginPath(); ctx.arc(hex.x, hex.y, 18, 0, 2 * Math.PI);
                    ctx.fillStyle = '#fffdf0'; ctx.fill(); ctx.stroke();
                    ctx.fillStyle = (hex.token === 6 || hex.token === 8) ? '#d32f2f' : '#111';
                    ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(hex.token, hex.x, hex.y);
                }
                if (id === G.robberHexIndex) {
                    ctx.beginPath(); ctx.arc(hex.x, hex.y, 22, 0, 2 * Math.PI);
                    ctx.fillStyle = '#222'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('🥷', hex.x, hex.y);
                }
            });

            G.edges.forEach(edge => {
                if (edge.port) {
                    let v1 = G.vertices[edge.v1], v2 = G.vertices[edge.v2];
                    let midX = (v1.x + v2.x) / 2; let midY = (v1.y + v2.y) / 2;
                    let dx = midX - centerX; let dy = midY - centerY;
                    let len = Math.hypot(dx, dy);
                    let px = midX + (dx/len) * 35; let py = midY + (dy/len) * 35; 
                    
                    ctx.save(); ctx.beginPath();
                    ctx.moveTo(v1.x, v1.y); ctx.lineTo(px, py);
                    ctx.moveTo(v2.x, v2.y); ctx.lineTo(px, py);
                    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 4; ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    let text = edge.port === '3:1' ? '⚓ 3:1' : `⚓ ${RESOURCE_TYPES[edge.port].short} 2:1`;
                    
                    let m = ctx.measureText(text);
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(px - m.width/2 - 6, py - 12, m.width + 12, 24);
                    
                    ctx.fillStyle = '#fff';
                    ctx.fillText(text, px, py);
                    ctx.restore();
                }

                if (edge.owner !== null) {
                    let v1 = G.vertices[edge.v1], v2 = G.vertices[edge.v2];
                    ctx.save(); ctx.beginPath(); ctx.moveTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y);
                    ctx.strokeStyle = G.players[edge.owner].color; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke(); ctx.restore();
                }
            });

            G.vertices.forEach(v => {
                if (v.building !== null) {
                    ctx.save(); ctx.fillStyle = G.players[v.owner].color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
                    if (v.building === 'settlement') { ctx.beginPath(); ctx.rect(v.x - 6, v.y - 6, 12, 12); ctx.fill(); ctx.stroke(); } 
                    else if (v.building === 'city') { ctx.beginPath(); ctx.arc(v.x, v.y, 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke(); }
                    ctx.restore();
                }
            });

            if (!G.players[G.activePlayerIdx]?.isAI) {
                ctx.save();
                if (G.phase === 'ROBBER') {
                    G.hexes.forEach((hex, id) => {
                        if (id !== G.robberHexIndex && hex.type !== 'DESERT') {
                            ctx.beginPath(); ctx.arc(hex.x, hex.y, 20, 0, 2 * Math.PI); ctx.fillStyle = 'rgba(255, 0, 0, 0.4)'; ctx.fill();
                        }
                    });
                }
                
                // Draw yellow/orange build mode highlights WITHOUT suppressing them during an undo hover!
                if (G.buildMode) {
                    if (G.buildMode === 'settlement' || G.buildMode === 'city') {
                        G.vertices.forEach((v, id) => {
                            if ((G.buildMode === 'settlement' && isValidSettlement(id, G.activePlayerIdx, G.phase === 'SETUP')) ||
                                (G.buildMode === 'city' && v.owner === G.activePlayerIdx && v.building === 'settlement')) {
                                ctx.beginPath(); ctx.arc(v.x, v.y, 8, 0, 2 * Math.PI); ctx.fillStyle = 'rgba(255, 235, 59, 0.6)'; ctx.fill();
                            }
                        });
                    } else if (G.buildMode === 'road') {
                        G.edges.forEach((e, id) => {
                            if (isValidRoad(id, G.activePlayerIdx, G.phase === 'SETUP' ? { lastVert: G.lastSetupVert } : false)) {
                                let v1 = G.vertices[e.v1], v2 = G.vertices[e.v2];
                                // Draw a highly visible thick orange line over the edge
                                ctx.beginPath(); ctx.moveTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y);
                                ctx.strokeStyle = 'rgba(255, 152, 0, 0.7)'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.stroke();
                                // With an orange dot in the middle
                                ctx.beginPath(); ctx.arc((v1.x + v2.x)/2, (v1.y + v2.y)/2, 6, 0, 2 * Math.PI); ctx.fillStyle = 'rgba(255, 152, 0, 0.9)'; ctx.fill();
                            }
                        });
                    }
                }
                
                // Draw the undo 'X' completely independently so it overlays
                if (hoverRemoveVert !== -1) {
                    let v = G.vertices[hoverRemoveVert];
                    ctx.beginPath(); ctx.arc(v.x, v.y, 14, 0, 2 * Math.PI); ctx.fillStyle = 'rgba(244, 67, 54, 0.85)'; ctx.fill();
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('X', v.x, v.y);
                } 
                ctx.restore();
            }
        }

        // --- DOM MANIPULATIONS / HUD UPDATE ---
        function updateUI() {
            let activePlayer = G.players[G.activePlayerIdx];
            if (!activePlayer) return;

            let banner = document.getElementById('status-banner');
            if (G.phase === 'GAME_OVER') {
                banner.innerText = `🏆 GAME OVER`;
                banner.className = '';
            } else if (G.phase === 'INIT_ROLL') {
                banner.innerText = `🎲 SETUP: Rolling for turn order...`;
                banner.className = '';
            } else if (G.phase === 'SETUP') {
                banner.innerText = `⚙️ SETUP: ${activePlayer.name} - Placing ${G.buildMode === 'settlement' ? 'Town' : 'Road'}`;
                banner.className = (!activePlayer.isAI ? 'action-required' : '');
            } else if (G.phase === 'ROLL') {
                banner.innerText = `🎲 ${activePlayer.name}'s Turn - Waiting to roll`;
                banner.className = (!activePlayer.isAI ? 'action-required' : '');
            } else if (G.phase === 'ROBBER' || G.phase === 'ROBBER_RESOLVING') {
                banner.innerText = `🥷 ACTION: ${activePlayer.name} must move Robber!`;
                banner.className = (!activePlayer.isAI ? 'action-required' : '');
            } else {
                let actionStr = G.lastAction ? ` - ${G.lastAction}` : '';
                let modeStr = G.buildMode ? ` [Placing ${G.buildMode === 'settlement' ? 'Town' : (G.buildMode === 'road' ? 'Road' : 'City')}]` : '';
                banner.innerText = `🚀 ${activePlayer.name}${actionStr}${modeStr} ${G.freeRoads > 0 ? `(Free Roads: ${G.freeRoads})` : ''}`;
                banner.className = (!activePlayer.isAI && G.freeRoads === 0 && !G.buildMode ? 'action-required' : '');
            }

            let isHumanMain = (!activePlayer.isAI && G.phase === 'MAIN');
            
            let rollBtn = document.getElementById('roll-btn');
            rollBtn.disabled = (activePlayer.isAI || G.phase !== 'ROLL');

            let endTurnBtn = document.getElementById('end-turn-btn');
            endTurnBtn.disabled = (!isHumanMain);
            endTurnBtn.innerText = (isHumanMain && G.freeRoads > 0) ? 'End Turn (Forfeit Roads)' : 'End Turn';

            document.getElementById('build-road-btn').disabled = !(isHumanMain && (canAfford(activePlayer, COSTS.road) || G.freeRoads > 0));
            document.getElementById('build-settlement-btn').disabled = !(isHumanMain && canAfford(activePlayer, COSTS.settlement) && G.freeRoads === 0);
            document.getElementById('build-city-btn').disabled = !(isHumanMain && canAfford(activePlayer, COSTS.city) && G.vertices.some(v => v.owner === activePlayer.id && v.building === 'settlement') && G.freeRoads === 0);
            document.getElementById('dev-card-btn').disabled = !(isHumanMain && canAfford(activePlayer, COSTS.devCard) && G.devDeck.length > 0 && G.freeRoads === 0);
            
            document.getElementById('open-trade-btn').disabled = !isHumanMain;
            updateBankTradeUI();

            // Clear and sort into separated panels for cleaner mobile/desktop views
            let humanPanel = document.getElementById('human-player-panel');
            let otherPanel = document.getElementById('other-players-panel');
            humanPanel.innerHTML = '';
            otherPanel.innerHTML = '';

            G.players.forEach((p, idx) => {
                let row = document.createElement('div');
                row.className = `player-row ${idx === G.activePlayerIdx ? 'active' : ''}`;
                
                let resHTML = ''; let devHTML = ''; let achHTML = '';
                
                if (G.longestRoadPlayer === p.id) achHTML += `<span>🛤️ Longest Road</span> `;
                if (G.largestArmyPlayer === p.id) achHTML += `<span>🛡️ Largest Army</span>`;
                if (achHTML !== '') achHTML = `<div class="achievements">${achHTML}</div>`;

                let displayScore = p.isAI ? p.publicVPs : p.victoryPoints;

                if (p.isAI) {
                    let totalRes = Object.values(p.resources).reduce((a, b) => a + b, 0);
                    let devCount = Object.values(p.devCards).reduce((a,b)=>a+b,0) + Object.values(p.newDevCards).reduce((a,b)=>a+b,0);
                    resHTML = `<div class="ai-stats"><span>📦 Cards: <strong>${totalRes}</strong></span><span>🃏 Devs: <strong>${devCount}</strong></span></div>`;
                } else {
                    resHTML = `
                        <div class="resource-grid human-cards">
                            <div class="res-badge" style="background:${RESOURCE_TYPES.WOOD.color}">🪵 ${p.resources.WOOD}</div>
                            <div class="res-badge" style="background:${RESOURCE_TYPES.BRICK.color}">🧱 ${p.resources.BRICK}</div>
                            <div class="res-badge" style="background:${RESOURCE_TYPES.WHEAT.color}">🌾 ${p.resources.WHEAT}</div>
                            <div class="res-badge" style="background:${RESOURCE_TYPES.SHEEP.color}">🐑 ${p.resources.SHEEP}</div>
                            <div class="res-badge" style="background:${RESOURCE_TYPES.ORE.color}">🪨 ${p.resources.ORE}</div>
                        </div>`;
                    
                    let devKeys = Object.keys(DEV_TYPES);
                    let hasAnyCards = devKeys.some(k => p.devCards[k] > 0 || p.newDevCards[k] > 0);
                    
                    if(hasAnyCards) {
                        devHTML += `<div class="dev-card-tracker">`;
                        devKeys.forEach(k => {
                            let oldC = p.devCards[k];
                            let newC = p.newDevCards[k];
                            let totalC = oldC + newC;
                            if (totalC > 0) {
                                // Strictly check if it's the human's turn before lighting the play button
                                let isHumanTurn = (!p.isAI && G.activePlayerIdx === p.id);
                                let isPlayable = (isHumanTurn && (G.phase === 'MAIN' || G.phase === 'ROLL') && !G.devCardPlayedThisTurn && k !== 'VP' && oldC > 0) ? '' : 'disabled';
                                
                                let btnText = 'Play';
                                if (k === 'VP') btnText = 'Passive';
                                else if (oldC === 0 && newC > 0) btnText = 'Wait 1 Turn';

                                devHTML += `<div class="dev-row">
                                    <span>${DEV_TYPES[k].name} (x${totalC})</span>
                                    ${k!=='VP' ? `<button type="button" class="play-btn" onclick="playDevCard('${k}', ${p.id})" ${isPlayable}>${btnText}</button>` : `<span style="font-size:0.8rem; color:#888;">Passive</span>`}
                                </div>`;
                            }
                        });
                        devHTML += `</div>`;
                    }
                }
                
                row.innerHTML = `<div class="player-header"><span class="player-name" style="color: ${p.color};">${p.name}</span><span class="player-score">🏆 ${displayScore}/${G.vpGoal}</span></div>${achHTML}${resHTML}${devHTML}`;
                
                if (p.isAI) {
                    otherPanel.appendChild(row);
                } else {
                    humanPanel.appendChild(row);
                }
            });
            render();
        }

        function populateTradeMenus() {
            let giveSelect = document.getElementById('trade-give'), getSelect = document.getElementById('trade-get');
            giveSelect.innerHTML = ''; getSelect.innerHTML = ''; 

            Object.keys(RESOURCE_TYPES).forEach(k => {
                if(k === 'DESERT') return;
                let optStr = `<option value="${k}">${RESOURCE_TYPES[k].short} ${RESOURCE_TYPES[k].name}</option>`;
                giveSelect.insertAdjacentHTML('beforeend', optStr); getSelect.insertAdjacentHTML('beforeend', optStr);
            });
        }

        function startNewLogTurnBlock(playerName) {
            let log = document.getElementById('log-container');
            let block = document.createElement('div');
            block.className = 'turn-block';
            block.innerHTML = `<div class="turn-block-header">${playerName}</div>`;
            log.prepend(block);
            G.currentTurnBlock = block;
        }

        function logMessage(msg, important = false, success = false) {
            if (!G.currentTurnBlock) return;
            let entry = document.createElement('div');
            entry.className = `log-entry ${important ? 'important' : ''} ${success ? 'success' : ''}`;
            entry.innerHTML = `• ${msg}`;
            G.currentTurnBlock.appendChild(entry);
        }
    </script>
</body>
