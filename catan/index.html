<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS Catan Clone</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-bg: #2a2a35;
            --text-color: #f5f5f5;
            --accent-color: #ff9f43;
            --wood-color: #2e7d32;
            --brick-color: #d84315;
            --wheat-color: #fbc02d;
            --sheep-color: #7cb342;
            --ore-color: #78909c;
            --desert-color: #d7ccc8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }

        /* Overlays & Modals */
        #setup-screen, #modal-overlay, #advanced-trade-modal, #discard-modal {
            position: absolute; width: 100%; height: 100%; background: rgba(30,30,36,0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #modal-overlay, #advanced-trade-modal, #discard-modal { z-index: 2000; display: none; }
        
        .setup-box {
            background: var(--panel-bg); padding: 30px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            text-align: center; max-width: 420px; width: 100%;
            max-height: 95vh; overflow-y: auto;
        }
        .large-box { max-width: 550px !important; }
        
        h1 { color: var(--accent-color); margin-bottom: 24px; font-size: 2.5rem; }
        h2 { color: #fff; margin-bottom: 15px; font-size: 1.5rem; }
        h3 { font-size: 1.1rem; margin-bottom: 12px; }
        
        .setup-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ccc; }
        select { width: 100%; padding: 10px; border-radius: 6px; background: #3e3e4f; color: #fff; border: 1px solid #555; font-size: 1rem; margin-bottom: 10px;}
        
        button {
            width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--accent-color);
            color: #fff; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        button:hover:not(:disabled) { background: #ffaa54; }
        button:disabled { background: #555 !important; cursor: not-allowed; opacity: 0.4; }
        .btn-secondary { background: #556; }
        .btn-secondary:hover:not(:disabled) { background: #667; }

        /* Main Layout Frame */
        #game-container { display: flex; width: 100%; height: 100%; }
        .side-panel { background: var(--panel-bg); display: flex; flex-direction: column; z-index: 10; overflow-y: auto; overflow-x: hidden; }
        
        /* Left Sidebar - Removed nested overflow to prevent scrolling traps */
        #sidebar { width: 460px; border-right: 2px solid #3a3a4a; order: 1; position: relative; }
        
        /* Central Map Container */
        #canvas-container { flex: 1; display: flex; flex-direction: column; position: relative; background: #141419; order: 2; padding: 0; }
        
        /* Right Sidebar */
        #right-panel { width: 360px; border-left: 2px solid #3a3a4a; order: 3; }

        /* Fixed Map Bounds Handling */
        canvas { 
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 520px;
            object-fit: contain; /* Proportional scaling without clipping */
            margin: auto; /* Centers the map in leftover space */
            cursor: default; 
            background-color: #102a43;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            touch-action: none; /* Prevents touchscreen panning */
        }

        .panel-section { padding: 15px; border-bottom: 1px solid #3a3a4a; }
        
        /* Action Required Cues & Keyframes */
        @keyframes pulse-action-banner {
            0% { background: #343444; color: var(--accent-color); }
            50% { background: #ff9f43; color: #1e1e24; }
            100% { background: #343444; color: var(--accent-color); }
        }
        
        /* Status Banner Native to the Map Panel */
        #status-banner { width: 100%; background: #343444; padding: 12px; font-weight: bold; text-align: center; font-size: 1.1rem; color: var(--accent-color); transition: background 0.3s; z-index: 100; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #status-banner.action-required { animation: pulse-action-banner 2.2s infinite ease-in-out; box-shadow: inset 0 0 12px rgba(255, 159, 67, 0.4); }

        /* Players Info */
        .player-row { padding: 12px; margin-bottom: 8px; border-radius: 6px; background: #323242; border-left: 6px solid transparent; }
        .player-row:last-child { margin-bottom: 0; }
        .player-row.active { border-left-color: var(--accent-color); background: #3d3d52; }
        .player-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .player-name { font-size: 1.1rem; }
        .player-score { font-size: 1.1rem; }
        .ai-stats { font-size: 0.95rem; color: #bbb; padding: 6px 0; display: flex; gap: 15px; }
        .achievements { font-size: 0.8rem; color: #ffd700; margin-top: 4px; font-weight: bold; }
        
        /* Resource Cards Grid */
        .resource-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 0.85rem; text-align: center; }
        .res-badge { padding: 4px; border-radius: 4px; font-weight: bold; color: #111; text-shadow: 0px 0px 2px rgba(255,255,255,0.5); }
        .human-cards { gap: 8px; font-size: 1.25rem; margin-top: 8px; }
        .human-cards .res-badge { padding: 12px 4px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Development Pool Tracker Layouts */
        .dev-card-tracker { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; background: #22222c; padding: 8px; border-radius: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .dev-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #eee; }
        .play-btn { width: auto; padding: 4px 10px; font-size: 0.8rem; margin: 0; background: #4caf50; }

        /* Actions Matrix & Trade Interfaces */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .action-btn { padding: 10px; font-size: 0.9rem; margin: 0; }
        .trade-container { display: flex; flex-direction: column; gap: 10px; }
        .trade-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; flex-wrap: wrap; gap: 5px; }
        .trade-selectors { display: flex; gap: 5px; align-items: center; }
        .trade-selectors select { padding: 5px; font-size: 0.85rem; background: #3e3e4f; color: #fff; border: 1px solid #555; border-radius: 4px; margin: 0; }
        .sub-header { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #889; font-weight: bold; }

        /* Trade UI Modular Sizing Matrix */
        .trade-grid { display: flex; gap: 15px; text-align: left; }
        .trade-col { flex: 1; background: #22222c; padding: 15px; border-radius: 8px; }
        .inc-btn { width: 30px; padding: 4px; margin: 0; font-size: 1.1rem; background: #445; flex-shrink: 0; }
        #adv-trade-status { min-height: 24px; font-weight: bold; font-size: 1.05rem; margin-bottom: 15px; }
        
        .trade-item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; width: 100%; }
        .trade-item-controls { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; } /* Forces buttons to never vertically stack */
        .trade-label { font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .trade-val { display: inline-block; width: 24px; text-align: center; font-size: 1.1rem; font-weight: bold; }

        /* Dice Face CSS Dots Vector Maps */
        #dice-section { padding: 20px; border-bottom: 1px solid #3a3a4a; display: flex; flex-direction: column; align-items: center; background: #2a2a35; position: sticky; top: 0; z-index: 50; }
        #dice-container { display: flex; gap: 24px; margin-top: 12px; }
        .die {
            width: 65px; height: 65px; background: #f5f5f5; border-radius: 12px;
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            padding: 7px; gap: 4px; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.15), 0 5px 10px rgba(0,0,0,0.4);
        }
        .dot { background: #1e1e24; border-radius: 50%; width: 9px; height: 9px; margin: auto; visibility: hidden; }
        .dot.active { visibility: visible; }

        /* Separated Turn Feed Log UI Blocks */
        #log-container { flex: 1; overflow-y: auto; padding: 15px; font-size: 0.85rem; line-height: 1.4; display: flex; flex-direction: column-reverse; background: #1a1a22; min-height: 0; }
        .turn-block { border: 1px solid #2d2d3a; background: #22222c; border-radius: 6px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .turn-block-header { font-weight: bold; color: var(--accent-color); border-bottom: 1px solid #3d3d52; padding-bottom: 4px; margin-bottom: 4px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .log-entry { color: #ccc; line-height: 1.35; }
        .log-entry.important { color: var(--accent-color); font-weight: bold; }
        .log-entry.success { color: #81c784; }
        .log-entry.robber { color: #e57373; font-style: italic; }

        /* ========================================================
           Mobile Responsiveness Matrix - Vertical Stacking 
           ======================================================== */
        @media (max-width: 950px) and (orientation: portrait) {
            body { height: auto; overflow-y: auto; overflow-x: hidden; }
            #game-container { flex-direction: column; display: flex; }
            
            /* Break the flex column wrappers so we can order elements globally */
            #sidebar, #right-panel { display: contents; }
            
            /* Restore backgrounds lost by display:contents */
            .panel-section, #dice-section, #log-container { 
                background: var(--panel-bg); 
                border-bottom: 2px solid #3a3a4a; 
                width: 100%; 
            }

            /* Highly requested re-ordering */
            #canvas-container { order: 1; padding: 0 5px 5px 5px; background: #0b1a2a; border-bottom: 3px solid var(--accent-color); height: 50vh; min-height: 350px; }
            #human-player-panel { order: 2; }
            #actions-panel { order: 3; }
            #trade-panel { order: 4; }
            #other-players-panel { order: 5; }
            #dice-section { order: 6; position: static; }
            #log-container { order: 7; overflow-y: visible; height: auto; flex: none; min-height: 300px; padding-bottom: 40px; }

            .action-grid { grid-template-columns: repeat(3, 1fr); }
            .human-cards { font-size: 1.1rem; }
            .trade-grid { flex-direction: column; }
        }

        /* ========================================================
           Landscape Media Queries - Forced Desktop-style Columns 
           ======================================================== */
        @media (max-height: 600px) and (orientation: landscape), (max-width: 950px) and (orientation: landscape) {
            html { font-size: 14px; }
            #sidebar { width: 35%; min-width: 280px; }
            #right-panel { width: 30%; min-width: 260px; display: flex; flex-direction: column; }
            #canvas-container { padding: 0 5px 5px 5px; }
            
            /* Shrink dice gracefully */
            #dice-section { padding: 10px; }
            #dice-container { gap: 15px; margin-top: 5px; }
            .die { width: 40px; height: 40px; padding: 4px; border-radius: 8px; }
            .dot { width: 6px; height: 6px; }
            
            /* Shrink AI player rows */
            .player-name, .player-score { font-size: 1rem; }
            .human-cards .res-badge { padding: 4px 2px; font-size: 0.9rem; }
            .action-grid { gap: 5px; }
            .action-btn { padding: 6px; font-size: 0.85rem; }
            #open-trade-btn { padding: 6px !important; }
            
            /* Ensure nested scrolling functions in squished heights */
            #log-container { padding: 5px; font-size: 0.75rem; flex: 1; }
            .turn-block { padding: 4px; margin-bottom: 4px; gap: 2px; }
            
            .setup-box { padding: 10px; margin: auto; }
            h1 { font-size: 1.5rem; margin-bottom: 10px; }
            
            /* Compact Trade/Discard Modals for Landscape */
            .setup-box h2 { margin-bottom: 8px; font-size: 1.2rem; }
            .setup-group { margin-bottom: 10px; }
            .trade-grid { gap: 5px; margin-bottom: 5px !important; }
            .trade-col { padding: 5px 10px; }
            .trade-col h3 { margin-bottom: 2px; font-size: 0.9rem; }
            .trade-item-row { margin-bottom: 2px !important; }
            .trade-label, .trade-val { font-size: 0.85rem !important; }
            .trade-item-controls { gap: 2px; }
            .inc-btn { padding: 0px; font-size: 0.9rem; width: 22px; height: 22px; }
            #adv-trade-status { margin-bottom: 5px !important; min-height: 18px; font-size: 0.9rem; }
            .setup-box button { padding: 6px; font-size: 0.95rem; margin-top: 5px; }
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-box">
            <h1>CATAN</h1>
            <div class="setup-group">
                <label for="player-count">Total Players</label>
                <select id="player-count">
                    <option value="3">3 Players (You + 2 AIs)</option>
                    <option value="4" selected>4 Players (You + 3 AIs)</option>
                </select>
            </div>
            <div class="setup-group">
                <label for="vp-goal">Victory Points Target</label>
                <select id="vp-goal">
                    <option value="10" selected>10 Points (Standard)</option>
                    <option value="13">13 Points (Expanded)</option>
                </select>
            </div>
            <button type="button" id="start-btn" onclick="startGame()">Start Game</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content" class="setup-box">
            <h2 id="modal-title">Notice</h2>
            <div id="modal-body" style="margin-bottom: 20px; color: #ddd;"></div>
            <div id="modal-actions" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;"></div>
        </div>
    </div>

    <div id="discard-modal">
        <div class="setup-box large-box">
            <h2>Robber Strikes!</h2>
            <p style="color: #e57373; margin-bottom: 15px;">You have too many cards! Select <strong id="discard-target-amt">0</strong> to discard.</p>
            <div class="trade-grid" style="margin-bottom: 15px; justify-content: center;">
                <div class="trade-col" id="discard-list" style="max-width: 300px;"></div>
            </div>
            <p style="margin-bottom: 10px;">Selected: <strong id="discard-current-amt">0</strong> / <span id="discard-req-amt">0</span></p>
            <button type="button" id="submit-discard-btn" onclick="submitHumanDiscard()" disabled>Confirm Discard</button>
        </div>
    </div>

    <div id="advanced-trade-modal">
        <div class="setup-box large-box">
            <h2>Propose Trade</h2>
            <div id="adv-trade-status"></div>
            <div class="trade-grid" style="margin-bottom: 15px;">
                <div class="trade-col">
                    <h3 style="color:#ff9f43;">You Offer</h3>
                    <div id="trade-offer-list"></div>
                </div>
                <div class="trade-col">
                    <h3 style="color:#4caf50;">You Want</h3>
                    <div id="trade-want-list"></div>
                </div>
            </div>
            <div style="margin-bottom: 15px; text-align:left;">
                <label>Target Player:</label>
                <select id="adv-trade-target"></select>
            </div>
            <div style="display:flex; gap: 10px;">
                <button type="button" id="submit-adv-trade-btn" onclick="handleAdvancedTradeProposal()">Propose</button>
                <button type="button" class="btn-secondary" onclick="closeTradeModal()">Close</button>
            </div>
        </div>
    </div>

    <div id="game-container">
        <div id="sidebar" class="side-panel">
            <!-- Separated the Human player visually from the other AI info -->
            <div id="human-player-panel" class="panel-section" style="padding-bottom: 5px;"></div>

            <div id="actions-panel" class="panel-section" style="padding-bottom: 5px;">
                <div class="action-grid">
                    <button type="button" id="roll-btn" class="action-btn" onclick="handleRoll()" disabled>Roll Dice</button>
                    <button type="button" id="end-turn-btn" class="action-btn" onclick="handleEndTurn()" disabled>End Turn</button>
                    <button type="button" id="build-road-btn" class="action-btn" onclick="setBuildMode('road')" disabled>Road (🪵🧱)</button>
                    <button type="button" id="build-settlement-btn" class="action-btn" onclick="setBuildMode('settlement')" disabled>Town (🪵🧱🌾🐑)</button>
                    <button type="button" id="build-city-btn" class="action-btn" onclick="setBuildMode('city')" disabled>City (🌾🌾🪨🪨🪨)</button>
                    <button type="button" id="dev-card-btn" class="action-btn" onclick="buyDevCard()" disabled>Dev Card (🌾🐑🪨)</button>
                </div>
            </div>

            <div id="trade-panel" class="panel-section">
                <div class="trade-container">
                    <div class="sub-header">Player Trade 🤝</div>
                    <button type="button" id="open-trade-btn" style="padding: 10px; margin: 0; font-size: 0.95rem;" onclick="openTradeModal()" disabled>Open Trade Menu</button>
                    
                    <hr style="border: 0; border-top: 1px solid #445; margin: 5px 0;">
                    <div class="sub-header">Maritime Trade ⚓</div>
                    <div class="trade-row">
                        <div class="trade-selectors">Give: <select id="trade-give" style="width: 75px;" onchange="updateBankTradeUI()"></select> ➡️ Get: <select id="trade-get" style="width: 75px;" onchange="updateBankTradeUI()"></select></div>
                        <button type="button" id="trade-btn" style="padding: 6px 12px; font-size: 0.85rem; width: auto;" onclick="handleBankTrade()" disabled>Execute (4:1)</button>
                    </div>
                </div>
            </div>

            <!-- AI Player Stats Drop Below Trade on Mobile -->
            <div id="other-players-panel" class="panel-section"></div>
        </div>

        <div id="canvas-container">
            <div id="status-banner">Setting up game...</div>
            <canvas id="boardCanvas" width="600" height="520"></canvas>
        </div>

        <div id="right-panel" class="side-panel">
            <div id="dice-section">
                <div style="font-weight:bold; color:var(--accent-color); letter-spacing: 1px; text-transform: uppercase;">Latest Roll</div>
                <div id="dice-container">
                    <div class="die" id="die1"></div>
                    <div class="die" id="die2"></div>
                </div>
            </div>
            <div id="log-container"></div>
        </div>
    </div>

    <script>
        const delay = ms => new Promise(res => setTimeout(res, ms));

        function showModal(title, bodyHtml, buttons = []) {
            return new Promise(resolve => {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-body').innerHTML = bodyHtml;
                
                const actionsDiv = document.getElementById('modal-actions');
                actionsDiv.innerHTML = '';
                
                buttons.forEach(btn => {
                    const el = document.createElement('button');
                    el.type = 'button';
                    el.className = btn.secondary ? 'btn-secondary' : '';
                    el.style.width = 'auto';
                    el.style.padding = '8px 16px';
                    el.innerText = btn.text;
                    
                    el.onclick = () => {
                        document.getElementById('modal-overlay').style.display = 'none';
                        if (btn.getVal) resolve(btn.getVal());
                        else resolve(btn.value);
                    };
                    actionsDiv.appendChild(el);
                });
                
                document.getElementById('modal-overlay').style.display = 'flex';
            });
        }

        // --- DATA STRUCTURES ---
        const RESOURCE_TYPES = {
            DESERT: { name: 'Desert', color: '#d7ccc8', short: '🏜️' },
            WOOD: { name: 'Wood', color: '#2e7d32', short: '🪵' },
            BRICK: { name: 'Brick', color: '#d84315', short: '🧱' },
            WHEAT: { name: 'Wheat', color: '#fbc02d', short: '🌾' },
            SHEEP: { name: 'Sheep', color: '#7cb342', short: '🐑' },
            ORE: { name: 'Ore', color: '#78909c', short: '🪨' }
        };

        const DEV_TYPES = {
            KNIGHT: { name: 'Knight ⚔️', type: 'KNIGHT' },
            VP: { name: 'Victory Point 📜', type: 'VP' },
            MONOPOLY: { name: 'Monopoly 👑', type: 'MONOPOLY' },
            ROAD_BUILDING: { name: 'Road Building 🛤️', type: 'ROAD_BUILDING' },
            YEAR_OF_PLENTY: { name: 'Year of Plenty 🎁', type: 'YEAR_OF_PLENTY' }
        };

        const PLAYER_CONFIGS = [
            { id: 0, name: 'You (Blue)', color: '#29b6f6', isAI: false },
            { id: 1, name: 'AI Red', color: '#ef5350', isAI: true },
            { id: 2, name: 'AI Orange', color: '#ffa726', isAI: true },
            { id: 3, name: 'AI Green', color: '#66bb6a', isAI: true }
        ];

        const MAP_ROW_LAYOUT = [ { r: -2, qStart: 0, count: 3 }, { r: -1, qStart: -1, count: 4 }, { r: 0, qStart: -2, count: 5 }, { r: 1, qStart: -2, count: 4 }, { r: 2, qStart: -2, count: 3 } ];
        const BASE_RESOURCES = [ 'DESERT', 'WOOD', 'WOOD', 'WOOD', 'WOOD', 'BRICK', 'BRICK', 'BRICK', 'WHEAT', 'WHEAT', 'WHEAT', 'WHEAT', 'SHEEP', 'SHEEP', 'SHEEP', 'SHEEP', 'ORE', 'ORE', 'ORE' ];
        const BASE_TOKENS = [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12];

        // --- STATE ---
        let G = {
            players: [], turnOrder: [], hexes: [], vertices: [], edges: [], devDeck: [],
            robberHexIndex: 0, activePlayerIdx: 0, turnIndex: 0, vpGoal: 10,
            phase: 'INIT_ROLL', postRobberPhase: 'MAIN', setupStep: 0, setupDirection: 1, dice: [1, 1], buildMode: null,
            interactionRadius: 20, devCardPlayedThisTurn: false, freeRoads: 0,
            largestArmyPlayer: null, longestRoadPlayer: null, currentTurnBlock: null, lastSetupVert: null,
            lastAction: '' // Tracks exact micro-moves for the real-time banner
        };

        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const hexRadius = 48; // Mathematically bounds perfectly within 600x520
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        let currentTradeOffer = { WOOD: 0, BRICK: 0, WHEAT: 0, SHEEP: 0, ORE: 0 };
        let currentTradeWant = { WOOD: 0, BRICK: 0, WHEAT: 0, SHEEP: 0, ORE: 0 };
        let humanDiscardState = { WOOD: 0, BRICK: 0, WHEAT: 0, SHEEP: 0, ORE: 0 };
        let discardTarget = 0;
        let resolveDiscardPromise = null;
        let hoverRemoveVert = -1;

        // Visual CSS Dots layout mapper
        const DIE_DOT_PATTERNS = {
            1: [4],
            2: [0, 8],
            3: [0, 4, 8],
            4: [0, 2, 6, 8],
            5: [0, 2, 4, 6, 8],
            6: [0, 2, 3, 5, 6, 8]
        };

        function drawCSSDie(dieId, val) {
            const dieEl = document.getElementById(dieId);
            if (!dieEl) return;
            dieEl.innerHTML = '';
            const pattern = DIE_DOT_PATTERNS[val] || [];
            for (let i = 0; i < 9; i++) {

        // Updated scaling to support object-ratio canvas sizing accurately
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            
            if (evt.changedTouches && evt.changedTouches.length > 0) {
                clientX = evt.changedTouches[0].clientX;
                clientY = evt.changedTouches[0].clientY;
            }
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initBoard() {
            let resPool = shuffle([...BASE_RESOURCES]);
            let tokenPool = shuffle([...BASE_TOKENS]);
            
            G.devDeck = shuffle([
                ...Array(14).fill('KNIGHT'), ...Array(5).fill('VP'), 
                ...Array(2).fill('MONOPOLY'), ...Array(2).fill('ROAD_BUILDING'), ...Array(2).fill('YEAR_OF_PLENTY')
            ]);
            
            G.hexes = []; G.vertices = []; G.edges = [];
            let hexIdx = 0;
            MAP_ROW_LAYOUT.forEach(row => {
                for (let i = 0; i < row.count; i++) {
                    let q = row.qStart + i, r = row.r;
                    let res = resPool[hexIdx];
                    let token = (res === 'DESERT') ? null : tokenPool.pop();
                    let x = centerX + hexRadius * Math.sqrt(3) * (q + r/2);
                    let y = centerY + hexRadius * 1.5 * r;

                    if (res === 'DESERT') G.robberHexIndex = hexIdx;
                    G.hexes.push({ id: hexIdx, q, r, x, y, type: res, token, vertexIds: [], edgeIds: [] });
                    hexIdx++;
                }
            });

            G.hexes.forEach(hex => {
                let localVerts = [];
                for (let i = 0; i < 6; i++) {
                    let angle = (Math.PI / 3) * i - (Math.PI / 6);
                    let vx = hex.x + hexRadius * Math.cos(angle);
                    let vy = hex.y + hexRadius * Math.sin(angle);
                    let vId = G.vertices.findIndex(v => Math.hypot(v.x - vx, v.y - vy) < 10);
                    if (vId === -1) {
                        G.vertices.push({ id: G.vertices.length, x: vx, y: vy, building: null, owner: null });
                        vId = G.vertices.length - 1;
                    }
                    localVerts.push(vId);
                    hex.vertexIds.push(vId);
                }
                for (let i = 0; i < 6; i++) {
                    let minV = Math.min(localVerts[i], localVerts[(i + 1) % 6]);
                    let maxV = Math.max(localVerts[i], localVerts[(i + 1) % 6]);
                    let eId = G.edges.findIndex(e => e.v1 === minV && e.v2 === maxV);
                    if (eId === -1) {
                        G.edges.push({ id: G.edges.length, v1: minV, v2: maxV, owner: null, hexCount: 0, port: null });
                        eId = G.edges.length - 1;
                    }
                    G.edges[eId].hexCount++;
                    hex.edgeIds.push(eId);
                }
            });

            let outerEdges = G.edges.filter(e => e.hexCount === 1);
            outerEdges = shuffle(outerEdges);
            let selectedPorts = [];
            let portTypes = ['3:1','3:1','3:1','3:1','WOOD','BRICK','WHEAT','SHEEP','ORE'];
            
            for (let e of outerEdges) {
                let conflict = selectedPorts.some(pEdge => pEdge.v1 === e.v1 || pEdge.v1 === e.v2 || pEdge.v2 === e.v1 || pEdge.v2 === e.v2);
                if (!conflict) {
                    e.port = portTypes.pop();
                    selectedPorts.push(e);
                    if (portTypes.length === 0) break;
                }
            }
        }

        function getPlayerTradeRates(pId) {
            let rates = { WOOD: 4, BRICK: 4, WHEAT: 4, SHEEP: 4, ORE: 4 };
            let pVerts = G.vertices.filter(v => v.owner === pId);
            
            for (let v of pVerts) {
                let vIdx = G.vertices.indexOf(v);
                let connectedEdges = G.edges.filter(e => e.v1 === vIdx || e.v2 === vIdx);
                for (let e of connectedEdges) {
                    if (e.port === '3:1') {
                        Object.keys(rates).forEach(r => rates[r] = Math.min(rates[r], 3));
                    } else if (e.port) {
                        rates[e.port] = 2;
                    }
                }
            }
            return rates;
        }

        async function handleAdvancedTradeProposal() {
            let totalOffered = Object.values(currentTradeOffer).reduce((a,b)=>a+b, 0);
            let totalWanted = Object.values(currentTradeWant).reduce((a,b)=>a+b, 0);
            if (totalOffered === 0 && totalWanted === 0) return;

            let targetId = document.getElementById('adv-trade-target').value;
            let targets = targetId === 'all' ? G.players.filter(x => x.isAI) : [G.players.find(x => x.id == targetId)];
            
            let tradeAccepted = false; let human = G.players[0];
            let statusDiv = document.getElementById('adv-trade-status');
            statusDiv.innerHTML = '';

            for (let ai of targets) {
                let canAfford = Object.keys(currentTradeWant).every(r => ai.resources[r] >= currentTradeWant[r]);
                if (!canAfford) continue;

                let score = 0;
                Object.keys(currentTradeOffer).forEach(r => {
                    let count = currentTradeOffer[r];
                    for(let i=0; i<count; i++) {
                        let currentAmt = ai.resources[r] + i;
                        if (currentAmt === 0) score += 2.0;       
                        else if (currentAmt === 1) score += 1.0;  
                        else score += 0.5;                        
                    }
                });
                
                Object.keys(currentTradeWant).forEach(r => {
                    let count = currentTradeWant[r];
                    for(let i=0; i<count; i++) {
                        let currentAmt = ai.resources[r] - i;
                        if (currentAmt <= 1) score -= 2.0;       
                        else if (currentAmt === 2) score -= 1.0; 
                        else score -= 0.5;                       
                    }
                });

                if (score + ((Math.random() * 1.5) - 0.5) >= 0.5) {
                    Object.keys(currentTradeOffer).forEach(r => { human.resources[r] -= currentTradeOffer[r]; ai.resources[r] += currentTradeOffer[r]; });
                    Object.keys(currentTradeWant).forEach(r => { human.resources[r] += currentTradeWant[r]; ai.resources[r] -= currentTradeWant[r]; });
                    
                    let msg = `🤝 ${ai.name} accepted your multi-card trade!`;
                    G.lastAction = 'Completed Trade';
                    logMessage(msg, true, true);
                    statusDiv.innerHTML = `<span style="color: #4caf50;">${msg}</span>`;
                    tradeAccepted = true; 
                    
                    currentTradeOffer = { WOOD: 0, BRICK: 0, WHEAT: 0, SHEEP: 0, ORE: 0 };
                    currentTradeWant = { WOOD: 0, BRICK: 0, WHEAT: 0, SHEEP: 0, ORE: 0 };
                    
                    updateUI(); renderTradeModal();
                    break;
                }
            }
            if (!tradeAccepted) { 
                let msg = `❌ Trade Rejected: No AI accepted your terms.`;
                logMessage(msg); statusDiv.innerHTML = `<span style="color: #e57373;">${msg}</span>`;
            }
        }

        // --- GAME LOOP ---
        function advanceTurnLoop() {
            G.lastAction = '';
            if (G.phase === 'SETUP') {
                let numP = G.players.length; G.setupStep++;
                if (G.setupStep === numP * 2) {
                    G.phase = 'ROLL'; G.activePlayerIdx = G.turnOrder[0]; G.turnIndex = 0; G.buildMode = null;
                    startNewLogTurnBlock(G.players[G.activePlayerIdx].name + " (Turn 1)");
                    logMessage("Draft phase completed. Regular turns begin!");
                } else if (G.setupStep === numP) {
                    G.setupDirection = 0; G.buildMode = 'settlement';
                    let idx = (numP * 2 - 1 - G.setupStep); G.activePlayerIdx = G.turnOrder[idx];
                    startNewLogTurnBlock(G.players[G.activePlayerIdx].name + " (Setup 2)");
                } else {
                    let idx = G.setupStep < numP ? G.setupStep : (numP * 2 - 1 - G.setupStep);
                    G.activePlayerIdx = G.turnOrder[idx]; G.buildMode = 'settlement';
                    let setupLabel = G.setupStep < numP ? "Setup 1" : "Setup 2";
                    startNewLogTurnBlock(G.players[G.activePlayerIdx].name + " (" + setupLabel + ")");
                }
            } else {
                let p = G.players[G.activePlayerIdx];
                Object.keys(p.newDevCards).forEach(k => { p.devCards[k] += p.newDevCards[k]; p.newDevCards[k] = 0; });
                G.devCardPlayedThisTurn = false; G.freeRoads = 0;
                
                G.turnIndex = (G.turnIndex + 1) % G.players.length;
                G.activePlayerIdx = G.turnOrder[G.turnIndex]; 
                G.phase = 'ROLL'; G.buildMode = null;
                
                startNewLogTurnBlock(G.players[G.activePlayerIdx].name);
            }
            updateUI(); checkCurrentPlayerTurn();
        }
